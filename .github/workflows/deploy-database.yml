name: Deploy database

# Applies new migrations to the Supabase project after they are merged into
# PartyApp. Needs two repository secrets: SUPABASE_ACCESS_TOKEN and
# SUPABASE_DB_PASSWORD (Settings > Secrets and variables > Actions).

on:
  push:
    branches: [PartyApp]
    paths: ["supabase/migrations/**", ".github/workflows/deploy-database.yml"]
  workflow_dispatch:

permissions:
  contents: read

# Never run two deploys at once.
concurrency:
  group: deploy-database
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    env:
      SUPABASE_PROJECT_REF: vvkckzrhzgdrazhjitse
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets are set
        run: |
          missing=0
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD; do
            if [ -z "${!name}" ]; then echo "::error::Repository secret $name is not set"; missing=1; fi
          done
          exit $missing
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - name: Show pending migrations
        run: supabase migration list --password "$SUPABASE_DB_PASSWORD"
      - name: Apply migrations
        run: supabase db push --yes --password "$SUPABASE_DB_PASSWORD"

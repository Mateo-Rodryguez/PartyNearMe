name: Back up database

# Every night, dumps the Supabase database (roles, schema and data, the three
# files Supabase's restore guide uses) and stores them in the private R2 bucket
# partynearme-backups, keeping the last 30 days. docs/backups.md says how to
# restore. Besides the two Supabase secrets the deploy workflow uses, it needs
# BACKUP_R2_ACCESS_KEY_ID and BACKUP_R2_SECRET_ACCESS_KEY: an R2 API token
# that can write to that bucket.

on:
  schedule:
    - cron: "17 3 * * *" # 03:17 UTC, when the app is quietest
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup-database
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-24.04
    env:
      SUPABASE_PROJECT_REF: vvkckzrhzgdrazhjitse
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      # R2 doesn't need the extra checksums newer AWS CLIs send by default.
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      R2_ENDPOINT: https://630c8ac9872f11e09ffed9fe3cb05b0c.r2.cloudflarestorage.com
      BUCKET: partynearme-backups
      KEEP_DAYS: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets are set
        run: |
          missing=0
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY; do
            if [ -z "${!name}" ]; then echo "::error::A repository secret for $name is not set (see docs/backups.md)"; missing=1; fi
          done
          exit $missing
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - name: Dump roles, schema and data
        run: |
          mkdir dump
          supabase db dump --linked --password "$SUPABASE_DB_PASSWORD" --role-only -f dump/roles.sql
          supabase db dump --linked --password "$SUPABASE_DB_PASSWORD" -f dump/schema.sql
          supabase db dump --linked --password "$SUPABASE_DB_PASSWORD" --data-only --use-copy -f dump/data.sql
          ls -l dump
          # An empty dump means something went wrong, not that there is no data.
          for f in dump/*.sql; do [ -s "$f" ] || { echo "::error::$f is empty"; exit 1; }; done
      - name: Upload to R2
        run: |
          name="$(date -u +%Y-%m-%d).tar.gz"
          tar czf "$name" -C dump .
          aws s3 cp "$name" "s3://$BUCKET/daily/$name" --endpoint-url "$R2_ENDPOINT" --no-progress
          echo "Stored daily/$name ($(du -h "$name" | cut -f1))" >> "$GITHUB_STEP_SUMMARY"
      - name: Delete backups older than ${{ env.KEEP_DAYS }} days
        run: |
          cutoff="$(date -u -d "-$KEEP_DAYS days" +%Y-%m-%d)"
          aws s3 ls "s3://$BUCKET/daily/" --endpoint-url "$R2_ENDPOINT" | awk '{print $4}' | while read -r file; do
            day="${file%.tar.gz}"
            if [[ "$day" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ && "$day" < "$cutoff" ]]; then
              aws s3 rm "s3://$BUCKET/daily/$file" --endpoint-url "$R2_ENDPOINT"
            fi
          done

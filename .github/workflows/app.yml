name: App

on:
  push:
    branches: [PartyApp]
    paths: ["app/**", ".github/workflows/app.yml"]
  pull_request:
    paths: ["app/**", ".github/workflows/app.yml"]

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Shared code tests
        run: ./gradlew --no-configuration-cache :core:jvmTest
      - name: Build the Android app
        run: ./gradlew --no-configuration-cache :androidApp:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: partynearme-debug-apk
          path: app/androidApp/build/outputs/apk/debug/*.apk
          retention-days: 14

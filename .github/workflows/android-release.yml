name: Android release

# Builds the Play Store bundle (.aab).
# - Pull requests: an unsigned release build, to prove it still builds.
# - Pushes to PartyApp: a signed bundle, kept as a download for 30 days.
# - Run by hand (Actions > Android release > Run workflow): the same, and, once the
#   Play service account secret exists, uploads it to the chosen Play track.
# Setup steps: docs/store-release.md.

on:
  push:
    branches: [PartyApp]
    paths: ["app/**", ".github/workflows/android-release.yml"]
  pull_request:
    paths: ["app/**", ".github/workflows/android-release.yml"]
  workflow_dispatch:
    inputs:
      track:
        description: "Play track to upload to (leave empty to only build)"
        type: choice
        options: ["", internal, alpha, beta, production]
        default: ""
      status:
        description: "draft = you press Release in Play Console yourself (needed until the app's first review); completed = goes out straight away"
        type: choice
        options: [draft, completed]
        default: draft
      version_name:
        description: "Version shown in the store, for example 1.0.0"
        type: string
        default: "1.0.0"

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    env:
      # Play needs a higher number on every upload; the run number only goes up.
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: ${{ inputs.version_name || '1.0.0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      # Secrets are not given to pull requests from forks, so every step that needs one
      # checks for it and the build goes on without it.
      - name: Add the Firebase settings (push notifications)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > androidApp/google-services.json
          else
            echo "::warning::GOOGLE_SERVICES_JSON is not set, so this build has no push notifications."
          fi

      - name: Add the upload key
        if: github.event_name != 'pull_request'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set, so the bundle is unsigned and Play will not accept it."
          fi

      - name: Build the release bundle
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-configuration-cache :androidApp:bundleRelease

      - name: Remove the upload key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: partynearme-release-aab
          path: app/androidApp/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Upload to Google Play
        if: github.event_name == 'workflow_dispatch' && inputs.track != ''
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::PLAY_SERVICE_ACCOUNT_JSON is not set. Upload the .aab from this run by hand, or add the secret (docs/store-release.md)."
            exit 1
          fi
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/play.json"
      - uses: r0adkll/upload-google-play@v1
        if: github.event_name == 'workflow_dispatch' && inputs.track != ''
        with:
          serviceAccountJson: ${{ runner.temp }}/play.json
          packageName: com.partynearme.app
          releaseFiles: app/androidApp/build/outputs/bundle/release/*.aab
          track: ${{ inputs.track }}
          status: ${{ inputs.status }}
      - name: Remove the Play key
        if: always()
        run: rm -f "$RUNNER_TEMP/play.json"

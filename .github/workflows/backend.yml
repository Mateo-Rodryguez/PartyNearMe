name: Backend

on:
  push:
    branches: [PartyApp]
    paths: ["backend/**", "supabase/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", "supabase/**", ".github/workflows/backend.yml"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install PostgreSQL 16 with PostGIS and pgvector
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q postgresql-16 postgresql-16-postgis-3 postgresql-16-pgvector
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Integration tests against Postgres
        run: |
          url="$(../supabase/test-db.sh start)"
          TEST_DATABASE_URL="$url" npm run test:db
      - run: npm run build

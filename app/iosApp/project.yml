# XcodeGen spec: `xcodegen generate` (in this folder) writes PartyNearMe.xcodeproj.
# The generated project isn't committed; this file is the source of truth.
name: PartyNearMe
options:
  bundleIdPrefix: com.partynearme
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  # Crash reports, including crashes in the shared Kotlin code.
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa
    exactVersion: 9.30.2
targets:
  PartyNearMe:
    type: application
    platform: iOS
    sources: [PartyNearMe]
    dependencies:
      - package: Sentry
        product: Sentry
    scheme: {}
    info:
      path: PartyNearMe/Info.plist
      properties:
        CFBundleDisplayName: PartyNearMe
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # Compose draws at the screen's full refresh rate on ProMotion iPhones.
        CADisableMinimumFrameDurationOnPhone: true
        NSLocationWhenInUseUsageDescription: PartyNearMe uses your location to show parties near you and to place the parties you create.
    settings:
      base:
        # Permanent once the app is on the App Store; matches the Android app.
        PRODUCT_BUNDLE_IDENTIFIER: com.partynearme.app
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        FRAMEWORK_SEARCH_PATHS: $(SRCROOT)/../iosKit/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS: [-framework, PartyNearMeKit, -lc++]
    preBuildScripts:
      - name: Build the shared Kotlin code
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :iosKit:embedAndSignAppleFrameworkForXcode

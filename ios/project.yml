# XcodeGen spec for the native iPhone app: `xcodegen generate` (in this folder)
# writes PartyNearMe.xcodeproj. The generated project isn't committed; this file
# is the source of truth. Everything here is Swift and SwiftUI: no Kotlin, no Gradle.
name: PartyNearMe
options:
  bundleIdPrefix: com.partynearme
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
packages:
  # Crash reports go to the Sentry project partynearme-app.
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa
    exactVersion: 9.30.2
targets:
  PartyNearMe:
    type: application
    platform: iOS
    sources: [PartyNearMe]
    dependencies:
      - package: Sentry
        product: Sentry
    # Capabilities. The App ID on developer.apple.com needs the same ones (docs/store-release.md).
    entitlements:
      path: PartyNearMe/PartyNearMe.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
        # Xcode switches this to production when the build is exported for TestFlight.
        aps-environment: development
    info:
      path: PartyNearMe/Info.plist
      properties:
        CFBundleDisplayName: PartyNearMe
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # partynearme:// links open the app: browser sign-in coming back, shared parties and posts.
        CFBundleURLTypes:
          - CFBundleURLName: com.partynearme.app
            CFBundleURLSchemes: [partynearme]
        # Only HTTPS, which is exempt, so TestFlight doesn't ask about export compliance each upload.
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: PartyNearMe uses the camera so you can take photos to post.
        NSLocationWhenInUseUsageDescription: PartyNearMe uses your location to show parties near you and to place the parties you create.
    settings:
      base:
        # Permanent once the app is on the App Store; matches the Android app.
        PRODUCT_BUNDLE_IDENTIFIER: com.partynearme.app
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
  PartyNearMeTests:
    type: bundle.unit-test
    platform: iOS
    sources: [PartyNearMeTests]
    dependencies:
      - target: PartyNearMe
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  PartyNearMe:
    build:
      targets:
        PartyNearMe: all
        PartyNearMeTests: [test]
    test:
      targets: [PartyNearMeTests]
